services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backup-hub-backend
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backup-hub
    
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backup-hub-scheduler
    command: php artisan schedule:work
    restart: always
    volumes:
      - ./backend:/var/www
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - backup-hub
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backup-hub-worker
    command: php artisan queue:work --queue=notifications,default
    restart: always
    volumes:
      - ./backend:/var/www
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - backup-hub

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backup-hub-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - backup-hub

  postgres:
    image: postgres:17
    container_name: backup-hub-postgres
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: backup_hub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backup-hub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backup_hub_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  sgb-1:
    build:
      context: ./sgb
      dockerfile: Dockerfile
    container_name: sgb-1
    command: npm run dev -- -p 3010
    ports:
      - "3010:3010"
    env_file:
      - ./sgb/.env.sgb1
    volumes:
      - ./sgb:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - backup-hub

  sgb-2:
    build:
      context: ./sgb
      dockerfile: Dockerfile
    container_name: sgb-2
    command: npm run dev -- -p 3020
    ports:
      - "3020:3020"
    env_file:
      - ./sgb/.env.sgb2
    volumes:
      - ./sgb:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_started
    networks:
      - backup-hub

volumes:
  postgres_data:

networks:
  backup-hub:
    driver: bridge